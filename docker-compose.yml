version: '3.8'

services:
  # HexStrike UI Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hexstrike-ui
    ports:
      - "4173:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - hexstrike-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # HexStrike Backend (if you have it)
  backend:
    image: hexstrike-backend:latest
    container_name: hexstrike-backend
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - HEXSTRIKE_HOST=0.0.0.0
      - HEXSTRIKE_PORT=8888
      - HEXSTRIKE_LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - hexstrike-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  hexstrike-network:
    driver: bridge

volumes:
  data:
  output:
