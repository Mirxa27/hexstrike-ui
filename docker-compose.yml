# HexStrike UI - Docker Compose
#
# Default profile (no flag) starts only the frontend:
#     docker compose up -d                  # frontend only
#
# To also run the optional HexStrike backend (you must have an image
# named ${HEXSTRIKE_BACKEND_IMAGE} or use `--profile backend` plus a
# pre-built image in your registry):
#     docker compose --profile backend up -d
#
# See `start.sh` / `start.bat` for friendlier wrappers.

services:
  # ─── HexStrike UI Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time backend URL used by the nginx reverse proxy at /api/.
        # Override with `BACKEND_URL=http://my-backend:8888 docker compose build`.
        BACKEND_URL: ${BACKEND_URL:-http://hexstrike-backend:8888}
        # `import.meta.env.VITE_*` values are baked into the static
        # bundle at build time, so they MUST be forwarded as build args
        # (not runtime env). Defaults match the nginx reverse-proxy
        # path so the in-container UI talks to the backend same-origin.
        VITE_HEXSTRIKE_URL: ${VITE_HEXSTRIKE_URL:-/api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: hexstrike-ui:latest
    container_name: hexstrike-ui
    ports:
      - "${FRONTEND_PORT:-4173}:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Lets nginx reach a LM Studio / Ollama server running on the Docker host
    # (for the same-origin /lmstudio proxy). Auto-provided on Docker Desktop;
    # this entry adds it on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hexstrike-network
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=64M,mode=0755,uid=1001,gid=1001
      - /var/run/nginx:size=8M,mode=0755,uid=1001,gid=1001
      - /var/run:size=8M,mode=0755,uid=1001,gid=1001
      - /tmp:size=16M,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ─── Optional HexStrike Backend ────────────────────────────────────────
  # Gated behind the "backend" compose profile so the default `up` works
  # cleanly even when you don't have a backend image available locally.
  backend:
    profiles: ["backend"]
    image: ${HEXSTRIKE_BACKEND_IMAGE:-hexstrike-backend:latest}
    # Build the backend image from the pinned upstream HexStrike server
    # (github.com/0x4m4/hexstrike-ai). `docker compose --profile backend up
    # --build` builds it; otherwise a pre-built ${HEXSTRIKE_BACKEND_IMAGE} is used.
    build:
      context: .
      dockerfile: docker/hexstrike-backend.Dockerfile
      args:
        HEXSTRIKE_REF: ${HEXSTRIKE_REF:-9b8c780f324ce5145a322bfa23c98886f8424ba3}
    container_name: hexstrike-backend
    ports:
      - "${BACKEND_PORT:-8888}:8888"
    volumes:
      - hexstrike-data:/app/data
      - hexstrike-output:/app/output
    environment:
      - HEXSTRIKE_HOST=0.0.0.0
      - HEXSTRIKE_PORT=8888
      - HEXSTRIKE_LOG_LEVEL=${HEXSTRIKE_LOG_LEVEL:-info}
    restart: unless-stopped
    networks:
      - hexstrike-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/health || curl -fsS http://localhost:8888/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Free local LLM (Ollama) ───────────────────────────────────────────
  # Gated behind the "llm" profile. Lets the whole stack run for FREE with no
  # API keys: the browser UI talks to Ollama directly at localhost:11434
  # (CORS opened via OLLAMA_ORIGINS). A small, tool-capable model is pulled on
  # first start. Override the model with OLLAMA_MODEL (e.g. qwen2.5:3b,
  # llama3.2:3b) for higher quality.
  #     docker compose --profile llm up -d
  # Then in the UI: Settings → Provider = Ollama → Fetch models → pick one.
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: hexstrike-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - hexstrike-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "Pulling free model: ${OLLAMA_MODEL:-qwen2.5:1.5b}"
        ollama pull ${OLLAMA_MODEL:-qwen2.5:1.5b} || echo "model pull failed (pull manually: docker compose exec ollama ollama pull <model>)"
        wait
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  hexstrike-network:
    driver: bridge

volumes:
  hexstrike-data:
  hexstrike-output:
  ollama-data:
