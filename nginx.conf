server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    # CSP allows the app to call configured LLM provider APIs and the
    # same-origin /api/ proxy. `connect-src` must be permissive enough to
    # cover user-configured custom providers and remote/self-hosted
    # HexStrike backends — keeping a strict allowlist would silently
    # break every "Custom" provider and any non-localhost backend URL.
    # Same-origin plus `https:` / `http:` scheme sources match how browser
    # CSP works: LAN LM Studio/Ollama (e.g. http://192.168.x.x:1234) cannot
    # be enumerated in advance; http://localhost:* alone is insufficient.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Note: deprecated X-XSS-Protection intentionally omitted.

    # Lightweight liveness endpoint for Docker healthcheck
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # JSON fallback for failed /api/* upstream (error_page); explicit alias
    # avoids SPA try_files serving index.html for this URI.
    location = /api-unavailable.json {
        alias /usr/share/nginx/html/api-unavailable.json;
        default_type application/json;
        access_log off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy to the optional HexStrike backend so the frontend
    # can call same-origin /api/* endpoints (avoids browser CORS issues).
    location /api/ {
        # Variable in proxy_pass defers DNS to request time so nginx starts
        # when `hexstrike-backend` is not yet running (frontend-only compose).
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 5s;
        set $hexstrike_upstream "hexstrike-backend:8888";
        proxy_pass http://$hexstrike_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Return 503 if backend unreachable (graceful fallback)
        error_page 502 503 504 =503 /api-unavailable.json;
        proxy_intercept_errors on;
        # Stream-friendly buffering off (long scans / SSE)
        proxy_buffering off;
    }

    # Backend exposes GET /health (JSON tool catalog source for v6 servers).
    # Same resolver pattern as /api/ so the frontend container starts without the backend.
    location = /health {
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 5s;
        set $hexstrike_upstream "hexstrike-backend:8888";
        proxy_pass http://$hexstrike_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
